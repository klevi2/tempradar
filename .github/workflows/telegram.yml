name: Daily Telegram post

on:
  schedule:
    # Three posts a day (UTC). These strings must match SLOTS in scripts/post_telegram.py.
    - cron: "15 6 * * *"   # morning: today's highs
    - cron: "15 12 * * *"  # midday: tomorrow's highs
    - cron: "15 21 * * *"  # evening: tomorrow's highs with the 12Z runs (sent silently)
    # GitHub can start scheduled runs late; a run more than 3 hours late is skipped.
  workflow_dispatch:
    inputs:
      kind:
        description: "Which post (auto picks by the current UTC time)"
        type: choice
        options: [auto, morning, noon, evening]
        default: auto
      dry_run:
        description: "Only print the message in the log, do not send it"
        type: boolean
        default: true
  # Extra post on demand without the GitHub UI: change .github/post-now and push to main.
  # Pushes that do not touch that file never trigger a post.
  push:
    branches: [main]
    paths: [".github/post-now"]

permissions:
  contents: write  # only to log each post on the "data" branch (calibration)

concurrency:
  group: telegram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCHEDULE: ${{ github.event.schedule }}
      POST_KIND: ${{ inputs.kind || 'auto' }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5

      # The calibration log lives on the "data" branch. Posting never depends on it.
      - name: Check out the calibration log
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: data
          path: track

      - name: Pick the post
        id: plan
        run: python3 scripts/post_telegram.py --plan

      # Each post leaves a marker in the Actions cache (key: slot + date). If the marker
      # exists, this post already went out, e.g. from an external trigger or a manual run,
      # so a late scheduled run does not send it twice.
      - name: Check whether this post already went out
        id: seen
        if: steps.plan.outputs.slot != ''
        uses: actions/cache/restore@v5
        with:
          path: .posted
          key: tg-posted-${{ steps.plan.outputs.slot }}-${{ steps.plan.outputs.date }}
          lookup-only: true

      - name: Already posted
        if: steps.plan.outputs.slot != '' && steps.seen.outputs.cache-hit == 'true'
        run: echo "::notice::The ${{ steps.plan.outputs.slot }} post for ${{ steps.plan.outputs.date }} already went out; skipped."

      - name: Build and send the post
        id: post
        if: steps.plan.outputs.slot != '' && steps.seen.outputs.cache-hit != 'true'
        run: python3 scripts/post_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL || 'https://klevi2.github.io/tempradar/' }}
          POST_SLOT: ${{ steps.plan.outputs.slot }}
          POST_DATE: ${{ steps.plan.outputs.date }}
          TRACK_DIR: ${{ hashFiles('track/README.md') != '' && 'track' || '' }}

      - name: Mark the post as sent
        if: steps.post.outcome == 'success' && env.DRY_RUN != '1'
        run: mkdir -p .posted && echo "${{ steps.plan.outputs.slot }} ${{ steps.plan.outputs.date }}" > .posted/marker

      - name: Save the marker
        if: steps.post.outcome == 'success' && env.DRY_RUN != '1'
        uses: actions/cache/save@v5
        with:
          path: .posted
          key: tg-posted-${{ steps.plan.outputs.slot }}-${{ steps.plan.outputs.date }}

      - name: Store the forecast for calibration
        if: steps.post.outcome == 'success' && env.DRY_RUN != '1' && hashFiles('track/README.md') != ''
        continue-on-error: true
        run: |
          bash scripts/commit_data.sh "Forecast, ${{ steps.plan.outputs.slot }} post for ${{ steps.plan.outputs.date }}"
